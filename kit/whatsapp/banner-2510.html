<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden}
body{background:#FBFAF7;font-family:'Heebo',sans-serif;color:#1A1B2E;position:relative}
.top{padding:84px 80px 0}
.kicker{display:inline-block;background:#FCE1EF;color:#EF55A5;font-weight:800;font-size:30px;padding:10px 26px;border-radius:40px}
h1{font-size:80px;line-height:1.08;font-weight:900;margin:30px 0 0;letter-spacing:-1px}
h1 em{font-style:normal;color:#EF55A5}
.chart{position:absolute;left:80px;right:80px;top:500px;height:560px;display:flex;align-items:flex-end;justify-content:center;gap:90px;border-bottom:4px solid #1A1B2E}
.col{width:330px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.val{white-space:nowrap;font-weight:900;font-size:50px;margin-bottom:16px;text-align:center;line-height:1.05}
.val small{display:block;font-size:26px;font-weight:500;color:#5E5F76;margin-top:6px}
.bar{width:100%;border-radius:22px 22px 0 0}
.state .bar{height:46px;background:#D9D6CE}
.state .val{color:#5E5F76;font-size:44px}
.ours .bar{height:360px;background:#EF55A5;position:relative}
.ours .val{color:#EF55A5;font-size:64px}
.labels{position:absolute;left:80px;right:80px;top:1078px;display:flex;justify-content:center;gap:90px}
.labels div{width:330px;text-align:center;font-size:30px;font-weight:700;line-height:1.2}
.labels .l2{color:#EF55A5}
.foot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#1A1B2E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;gap:18px}
.foot b{color:#CCD537}
</style></head><body>
<div class="top">
  <div class="kicker">הדרכה חינמית · אמא משקיעה</div>
  <h1>מה יחכה לילד שלך<br>כשיגיע <em>לחתונה,</em><br><em>לדירה וללימודים?</em></h1>
</div>
<div class="chart">
  <div class="col state"><div class="val">עשרות אלפים<small>גם במקסימום</small></div><div class="bar"></div></div>
  <div class="col ours"><div class="val">חצי מיליון ₪</div><div class="bar"></div></div>
</div>
<div class="labels">
  <div>"חיסכון לכל ילד"<br>של המדינה</div>
  <div class="l2">מכספים קטנים<br>שכבר מגיעים אלייך</div>
</div>
<div class="foot">יום ראשון · 25.10 · 20:00 · <b>בזום, ללא עלות</b></div>
</body></html>
