<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
body{font-family:'Heebo',sans-serif;color:#1A1B2E;position:relative;background:#F6EEE4 url(kid-check.png) left center/1200px auto no-repeat}
.txt{position:absolute;right:52px;top:44px;width:520px}
.kicker{display:inline-block;background:#EF55A5;color:#fff;font-weight:800;font-size:21px;padding:7px 20px;border-radius:30px}
h1{font-size:50px;line-height:1.1;font-weight:900;margin:16px 0 0;letter-spacing:-.5px}
h1 em{font-style:normal;color:#EF55A5}
.card{margin-top:18px;width:430px;padding:14px 18px 10px;background:rgba(255,255,255,.92);border-radius:20px;box-shadow:0 8px 24px rgba(26,27,46,.12)}
.chart{height:120px;display:flex;align-items:flex-end;justify-content:center;gap:40px;border-bottom:2px solid #1A1B2E}
.col{width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.val{white-space:nowrap;font-weight:900;line-height:1;margin-bottom:6px}
.bar{width:100%;border-radius:10px 10px 0 0}
.state .bar{height:12px;background:#D9D6CE}.state .val{color:#5E5F76;font-size:19px}
.ours .bar{height:78px;background:#EF55A5}.ours .val{color:#EF55A5;font-size:25px}
.lab{display:flex;justify-content:center;gap:40px;margin-top:6px}
.lab div{width:150px;text-align:center;font-size:15px;font-weight:700;line-height:1.15}
.lab .l2{color:#EF55A5}
.foot{position:absolute;right:52px;bottom:40px;display:flex;align-items:center;gap:14px}
.pill{background:#1A1B2E;color:#fff;border-radius:40px;height:58px;line-height:58px;padding:0 24px;font-size:23px;font-weight:800;white-space:nowrap}
.pill b{color:#CCD537}
.go{background:#EF55A5;color:#fff;border-radius:40px;height:58px;line-height:58px;padding:0 24px;font-size:23px;font-weight:900;white-space:nowrap}
</style></head><body>
<div class="txt">
  <div class="kicker">הדרכה חינמית · אמא משקיעה</div>
  <h1>מה יחכה לילד שלך<br><em>כשיגיע לחתונה,<br>לדירה וללימודים?</em></h1>
  <div class="card">
    <div class="chart">
      <div class="col state"><div class="val">עשרות אלפים</div><div class="bar"></div></div>
      <div class="col ours"><div class="val">חצי מיליון ₪</div><div class="bar"></div></div>
    </div>
    <div class="lab"><div>"חיסכון לכל ילד"</div><div class="l2">מכספים קטנים</div></div>
  </div>
</div>
<div class="foot"><div class="go">לשריון מקום »</div><div class="pill">ראשון 25.10 · 20:00 · <b>בזום</b></div></div>
</body></html>
