<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תצוגת אייפון · דף ההדרכה 7.9</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Heebo',sans-serif;background:#141522;color:#fff;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
  .top h1{font-size:1.05rem;font-weight:700;color:rgba(255,255,255,.75)}
  .sizes{display:flex;gap:6px;background:rgba(255,255,255,.08);border-radius:100px;padding:4px}
  .sizes button{background:none;border:none;color:rgba(255,255,255,.7);font:inherit;font-weight:700;
                font-size:.85rem;padding:7px 14px;border-radius:100px;cursor:pointer}
  .sizes button.on{background:#EF55A5;color:#fff}
  .open{color:#CCD537;font-weight:700;font-size:.9rem;text-decoration:none}
  .open:hover{text-decoration:underline}

  /* ---- המכשיר ---- */
  .phone{position:relative;width:calc(var(--w) + 24px);height:calc(var(--h) + 24px);
         background:#1c1c1e;border-radius:58px;padding:12px;
         box-shadow:0 0 0 2px #3a3a3c, 0 40px 90px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.08);
         --w:390px;--h:844px;transition:width .25s,height .25s}
  .phone.se{--w:375px;--h:667px;border-radius:44px}
  .phone.pro{--w:393px;--h:852px}
  .phone.plus{--w:430px;--h:932px}
  .screen{width:var(--w);height:var(--h);border-radius:46px;overflow:hidden;background:#1A1B2E;position:relative;padding-top:54px}
  .phone.se .screen{padding-top:28px}
  .phone.se .screen{border-radius:32px}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;
          background:#000;border-radius:20px;z-index:3}
  .phone.se .island{display:none}
  .bar{position:absolute;top:0;inset-inline:0;height:54px;z-index:2;display:flex;align-items:flex-end;
       justify-content:space-between;padding:0 30px 8px;font-size:.86rem;font-weight:700;color:#fff;
       pointer-events:none}
  .phone.se .bar{height:28px;padding:0 18px 0;font-size:.78rem}
  iframe{width:100%;height:100%;border:0;display:block;background:#FBFAF7}
  .home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;
        background:#1A1B2E;border-radius:5px;opacity:.85;z-index:3}
  .phone.se .home{display:none}
  .side{position:absolute;background:#2c2c2e;border-radius:3px}
  .side.l1{left:-3px;top:150px;width:3px;height:34px}
  .side.l2{left:-3px;top:200px;width:3px;height:62px}
  .side.l3{left:-3px;top:272px;width:3px;height:62px}
  .side.r{right:-3px;top:220px;width:3px;height:96px}
  .hint{margin-top:18px;font-size:.84rem;color:rgba(255,255,255,.45)}
  @media(max-height:940px){ .phone{transform:scale(.88);transform-origin:top center} .hint{margin-top:-70px} }
  @media(max-height:820px){ .phone{transform:scale(.76)} .hint{margin-top:-170px} }
</style>
</head>
<body>

<div class="top">
  <h1>ככה זה נראה בטלפון</h1>
  <div class="sizes" role="group" aria-label="גודל מכשיר">
    <button type="button" data-size="se">iPhone SE</button>
    <button type="button" data-size="" class="on">iPhone 14</button>
    <button type="button" data-size="pro">15 Pro</button>
    <button type="button" data-size="plus">Plus / Max</button>
  </div>
  <a class="open" href="../" target="_blank" rel="noopener">לפתוח את הדף עצמו ↗</a>
</div>

<div class="phone" id="phone">
  <span class="side l1"></span><span class="side l2"></span><span class="side l3"></span><span class="side r"></span>
  <div class="screen">
    <div class="island"></div>
    <div class="bar"><span id="clock">20:30</span><span>●●● ᯤ ▮</span></div>
    <iframe src="../" title="דף ההדרכה בתצוגת טלפון"></iframe>
    <span class="home"></span>
  </div>
</div>

<p class="hint">אפשר לגלול בתוך המסך. הגרסה החיה, לא צילום.</p>

<script>
  var phone = document.getElementById('phone');
  document.querySelectorAll('.sizes button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.sizes button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      phone.className = 'phone ' + b.dataset.size;
    });
  });
  var d = new Date(); document.getElementById('clock').textContent = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
</script>
</body>
</html>
